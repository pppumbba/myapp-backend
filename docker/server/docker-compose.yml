# The API on our own server (Hetzner Cloud): the same image as Render, behind Caddy for HTTPS.
# Uploads and PDFs live in the app-storage volume, the database in mysql-data, so both survive
# restarts and deploys. Run from docker/server: docker compose up -d --build
services:
  app:
    build: ../..
    env_file: .env.production
    environment:
      PORT: 8080
      # Chat push; the two secrets are set once in .env next to this file (setup.sh makes them).
      CENTRIFUGO_URL: http://centrifugo:8000
      CENTRIFUGO_API_KEY: ${CENTRIFUGO_API_KEY}
      CENTRIFUGO_SECRET: ${CENTRIFUGO_SECRET}
      # The MySQL below (these win over .env.production). Schema names are the ones the data came
      # with (move-db.sh): DB_MAIN_DATABASE holds users and logins, DB_DATABASE is the first customer's.
      DB_CONNECTION: mysql
      DB_HOST: mysql
      DB_PORT: 3306
      DB_USERNAME: wand
      DB_PASSWORD: ${DB_PASSWORD}
      DB_DATABASE: ${DB_DATABASE:-laravel_adopt_customertest}
      DB_MAIN_DATABASE: ${DB_MAIN_DATABASE:-laravel_main_customertest}
      # No TLS inside the server's own network (Aiven needed a CA; start.sh only sets one if given).
      MYSQL_ATTR_SSL_CA: ""
      MYSQL_CA_CERT: ""
    volumes:
      - app-storage:/var/www/html/storage/app
    depends_on:
      mysql:
        condition: service_healthy
    restart: unless-stopped

  # The database, on this server only: no port is published, the app reaches it as mysql:3306.
  # The wand user may make schemas (one per customer), views and triggers, like Aiven's avnadmin.
  mysql:
    image: mysql:8.4.3
    command: ["--log-bin-trust-function-creators=1", "--skip-name-resolve"]
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD}
      DB_PASSWORD: ${DB_PASSWORD}
    volumes:
      - mysql-data:/var/lib/mysql
      - ./mysql-init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h 127.0.0.1 -uroot -p\"$$MYSQL_ROOT_PASSWORD\" --silent"]
      interval: 5s
      timeout: 5s
      retries: 30
      start_period: 30s
    restart: unless-stopped

  # Pushes chat changes to browsers over WebSockets (App\Support\Realtime). The API publishes to it
  # inside the network; browsers reach it through Caddy at /connection/websocket.
  centrifugo:
    image: centrifugo/centrifugo:v6.10.1
    command: centrifugo
    environment:
      CENTRIFUGO_CLIENT_TOKEN_HMAC_SECRET_KEY: ${CENTRIFUGO_SECRET}
      CENTRIFUGO_HTTP_API_KEY: ${CENTRIFUGO_API_KEY}
      CENTRIFUGO_CLIENT_ALLOWED_ORIGINS: ${CENTRIFUGO_ALLOWED_ORIGINS}
      CENTRIFUGO_HEALTH_ENABLED: "true"
      CENTRIFUGO_LOG_LEVEL: warn
    ulimits:
      nofile: 65536
    restart: unless-stopped

  caddy:
    image: caddy:2.8.4
    ports:
      - "80:80"
      - "443:443"
    environment:
      DOMAIN: ${DOMAIN}
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy-data:/data
      - caddy-config:/config
    depends_on:
      - app
      - centrifugo
    restart: unless-stopped

volumes:
  app-storage:
  mysql-data:
  caddy-data:
  caddy-config:
