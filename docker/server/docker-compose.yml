# The API on our own server (Hetzner Cloud): the same image as Render, behind Caddy for HTTPS.
# Uploads and PDFs live in the app-storage volume, so they survive restarts and deploys.
# Run from docker/server: docker compose up -d --build
services:
  app:
    build: ../..
    env_file: .env.production
    environment:
      PORT: 8080
      # Chat push; the two secrets are set once in .env next to this file (setup.sh makes them).
      CENTRIFUGO_URL: http://centrifugo:8000
      CENTRIFUGO_API_KEY: ${CENTRIFUGO_API_KEY}
      CENTRIFUGO_SECRET: ${CENTRIFUGO_SECRET}
    volumes:
      - app-storage:/var/www/html/storage/app
      - ./aiven-ca.pem:/etc/secrets/aiven-ca.pem:ro
    restart: unless-stopped

  # Pushes chat changes to browsers over WebSockets (App\Support\Realtime). The API publishes to it
  # inside the network; browsers reach it through Caddy at /connection/websocket.
  centrifugo:
    image: centrifugo/centrifugo:v6.10.1
    command: centrifugo
    environment:
      CENTRIFUGO_CLIENT_TOKEN_HMAC_SECRET_KEY: ${CENTRIFUGO_SECRET}
      CENTRIFUGO_HTTP_API_KEY: ${CENTRIFUGO_API_KEY}
      CENTRIFUGO_CLIENT_ALLOWED_ORIGINS: ${CENTRIFUGO_ALLOWED_ORIGINS}
      CENTRIFUGO_HEALTH_ENABLED: "true"
      CENTRIFUGO_LOG_LEVEL: warn
    ulimits:
      nofile: 65536
    restart: unless-stopped

  caddy:
    image: caddy:2.8.4
    ports:
      - "80:80"
      - "443:443"
    environment:
      DOMAIN: ${DOMAIN}
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy-data:/data
      - caddy-config:/config
    depends_on:
      - app
      - centrifugo
    restart: unless-stopped

volumes:
  app-storage:
  caddy-data:
  caddy-config:
